<!DOCTYPE html>
<html>
    <body>
        <form action="index.php" method="POST" enctype="multipart/form-data">
            <label for="username"> username:</label>
            <input type ="text" id="username" placeholder="spongbob" maxlenght="15" minlenght="6" required>
            <br>
            <label for="password"> password:</label>
            <input type ="password" id ="password" maxlenght="15" minlenght="6" required>
            <br>
            <label for="email"> email:</label>
            <input type ="email" id ="email" placeholder="agrawalashly@gmai.com" >
            <br>
            <label for="phone"> phone#</label>
            <input type="tel" id="phone" placeholder="123-456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" >
            <br>
            <label for="bday"> birthdate:</label>
            <input type="date" id="bday">
            <br>
            <label for="quantity"> quantity:</label>
            <input type="number" id="quantity" min="0" max="1" value="1">
            <br>
            <label for="title"> title:</label>
            <label for="Mr"> Mr:</label>
            <input type="radio" id="Mr" value="Mr" name="title" >
            <label for="Mrs"> Mrs:</label>
            <input type="radio" id="MrS" value="MrS" name="title">
            <label for="phd"> phd:</label>
            <input type="radio" id="phd" value="phd" name="title" >
            <br>
            <label for="payment"> payment</label>
            <select id ="payment" >
                <option value="visa" >visa  </option>
                <option value="mastercard"> mastercard </option>
                <option value="giftcard" > giftcard  </option>
            </select>
            <br>
            <label for="suscribe"> suscribe:</label>
            <input type="checkbox" id="suscribe">
            <br>
            <label for="comment"> comment:</label>
            <textarea id="comment" rows="3" cols="25"></textarea>
            <br>
            <label for="file"> file:</label>
            <input type="file" id="file" accept="image/png, image/jpeg">

            <input type="reset">
            
            
            <input type ="submit">
        </form>
    </body>
</html>
